<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التقرير الأكاديمي السلوكي · سبع سنابل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800;900&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout mirrors alshaimaa-school.com: cream announcement strip, maroon vision band, white logo header, gold-framed pill nav, rounded cards; navy kept as a quiet accent */
:root{
  --maroon:#62102A; --maroon-2:#4A0B20; --maroon-deep:#2B0C17; --maroon-soft:rgba(138,21,56,.08);
  --gold:#B8903A; --gold-2:#E0BE73; --gold-3:#F3DDA0; --gold-soft:rgba(184,144,58,.14);
  --cream:#FFF5D3; --navy:#16233F; --navy-2:#24365E; --navy-ink:#1B2A4A; --navy-soft:rgba(22,35,63,.07);
  --bg:#FCFAF6; --paper:#FFFFFF; --ink:#2A1820; --muted:#7D6E73; --line:#F0E6D6;
  --hero-bg:linear-gradient(135deg,#FFFDF9 0%,#FCF3EE 50%,#F7E4DF 100%); --hero-veil:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,253,248,.65) 42%,rgba(255,253,248,.96) 70%); --hero-title:linear-gradient(100deg,#4A0B20 0%,#6E1432 35%,#93203F 55%,#5E0F28 100%); --hero-verse:#1B2A4A; --hero-text:#5C4E54; --hero-line:#EADBBE;
  --mint:#E6F6EF; --rose:#FCEBEF; --sky:#EAF0FB; --sand:#FFF6DE;
  --ok:#1F8A5B; --ok-soft:#E3F5EC; --warn:#B26B00; --warn-soft:#FFF1D6; --bad:#B4233F; --bad-soft:#FDE8EC;
  --ear-line:rgba(184,144,58,.55); --ear-empty:rgba(184,144,58,.18);
  --shadow:0 12px 32px -22px rgba(88,20,40,.28);
  --foil:linear-gradient(100deg,#9B7329 0%,#E0BE73 22%,#FBEBB8 38%,#D2AC58 56%,#A57B2C 76%,#EBCB84 100%);
  --f-brand:'Aref Ruqaa','Amiri',serif; --brand-grad:linear-gradient(to left,#4A0B20 0%,#7A1838 38%,#B8903A 78%,#E0BE73 100%); --f-latin:'Cormorant Garamond',Georgia,serif;
  --f-ui:'Tajawal','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-quran:'Amiri Quran','Amiri','Traditional Arabic',serif;
  --f-callig:'Aref Ruqaa','Amiri','Traditional Arabic',serif;
  --f-display:'Tajawal','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --r:22px; --bld:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --maroon:#D25C7E; --maroon-2:#B0405F; --maroon-deep:#1A070E; --maroon-soft:rgba(210,92,126,.12);
  --gold:#E0BE73; --gold-2:#EBCB84; --gold-3:#F7E2A6; --gold-soft:rgba(224,190,115,.14);
  --cream:#2C2112; --navy:#0F1830; --navy-2:#3A5288; --navy-ink:#A9BCE6; --navy-soft:rgba(169,188,230,.12);
  --bg:#140A0F; --paper:#1F1218; --ink:#F4EADF; --muted:#B7A79F; --line:#3A2630;
  --ok:#5FCB95; --ok-soft:rgba(95,203,149,.13); --warn:#F0B35A; --warn-soft:rgba(240,179,90,.13); --bad:#F07890; --bad-soft:rgba(240,120,144,.13);
  --ear-line:rgba(224,190,115,.45); --ear-empty:rgba(224,190,115,.16); --shadow:0 10px 30px -18px rgba(0,0,0,.7); --hero-bg:linear-gradient(135deg,#24151C 0%,#1F1218 60%,#2A1A12 100%); --hero-veil:linear-gradient(90deg,rgba(31,18,24,0) 0%,rgba(31,18,24,.6) 42%,rgba(31,18,24,.95) 70%); --hero-title:linear-gradient(100deg,#9B7329,#E0BE73 22%,#FBEBB8 38%,#D2AC58 56%,#EBCB84); --hero-verse:#F3DDA0; --hero-text:#D9C9BD; --hero-line:rgba(224,190,115,.3); --mint:rgba(95,203,149,.12); --rose:rgba(240,120,144,.12); --sky:rgba(169,188,230,.12); --sand:rgba(224,190,115,.12); --brand-grad:linear-gradient(to left,#E28AA4 0%,#E9A7A0 40%,#E9CB86 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --maroon:#D25C7E; --maroon-2:#B0405F; --maroon-deep:#1A070E; --maroon-soft:rgba(210,92,126,.12);
  --gold:#E0BE73; --gold-2:#EBCB84; --gold-3:#F7E2A6; --gold-soft:rgba(224,190,115,.14);
  --cream:#2C2112; --navy:#0F1830; --navy-2:#3A5288; --navy-ink:#A9BCE6; --navy-soft:rgba(169,188,230,.12);
  --bg:#140A0F; --paper:#1F1218; --ink:#F4EADF; --muted:#B7A79F; --line:#3A2630;
  --ok:#5FCB95; --ok-soft:rgba(95,203,149,.13); --warn:#F0B35A; --warn-soft:rgba(240,179,90,.13); --bad:#F07890; --bad-soft:rgba(240,120,144,.13);
  --ear-line:rgba(224,190,115,.45); --ear-empty:rgba(224,190,115,.16); --shadow:0 10px 30px -18px rgba(0,0,0,.7); --hero-bg:linear-gradient(135deg,#24151C 0%,#1F1218 60%,#2A1A12 100%); --hero-veil:linear-gradient(90deg,rgba(31,18,24,0) 0%,rgba(31,18,24,.6) 42%,rgba(31,18,24,.95) 70%); --hero-title:linear-gradient(100deg,#9B7329,#E0BE73 22%,#FBEBB8 38%,#D2AC58 56%,#EBCB84); --hero-verse:#F3DDA0; --hero-text:#D9C9BD; --hero-line:rgba(224,190,115,.3); --mint:rgba(95,203,149,.12); --rose:rgba(240,120,144,.12); --sky:rgba(169,188,230,.12); --sand:rgba(224,190,115,.12); --brand-grad:linear-gradient(to left,#E28AA4 0%,#E9A7A0 40%,#E9CB86 100%); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.75;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* announcement */
.annc{background:var(--cream);border-bottom:1px solid color-mix(in srgb,var(--gold) 35%,transparent);color:var(--maroon);font-weight:700;font-size:14px}
.annc .in{display:flex;align-items:center;gap:12px;padding-block:9px}
.annc svg{width:22px;height:22px;flex:none}
.marq{overflow:hidden;flex:1;white-space:nowrap;mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq span{display:inline-block;padding-inline-start:100%}
@media (prefers-reduced-motion:no-preference){.marq span{animation:marq 38s linear infinite}@keyframes marq{to{transform:translateX(100%)}}}
/* maroon band */
.band{background:linear-gradient(110deg,#6A1230 0%,#520D25 55%,#3A0817 100%);color:#fff}
.band .in{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding-block:16px}
.band{position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#F3DDA0,#C9A24A);-webkit-mask:var(--bld) center 58%/cover no-repeat;mask:var(--bld) center 58%/cover no-repeat;opacity:.2;pointer-events:none}
.band .in{position:relative}
.word{flex:1;min-width:260px;margin:0;display:flex;flex-direction:column;gap:4px;padding-inline-start:18px;border-inline-start:2px solid rgba(224,190,115,.6)}
.word-k{color:var(--gold-2);font-size:13px;font-weight:800;letter-spacing:.03em}
.word blockquote{margin:0;font-family:'Amiri',serif;font-size:22px;line-height:1.7;color:#fff;transition:opacity .6s ease;min-height:2.2em}
.word blockquote.fade{opacity:0}
.word-by{color:var(--gold-2);font-weight:800;font-size:14px}
.word-by span{color:#EADBD0;font-weight:500}
.vp{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;background:linear-gradient(135deg,color-mix(in srgb,var(--cream) 85%,var(--paper)) 0%,var(--paper) 70%);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:26px;padding:16px 24px;box-shadow:var(--shadow);overflow:hidden}
.vp::after{content:"";position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--gold) 25%,transparent);border-radius:20px;pointer-events:none}
.vp-q{font-family:'Amiri',serif;font-size:80px;line-height:.8;color:var(--gold);opacity:.55;margin-top:-6px}
.vp-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.vp-kx{align-self:flex-start;background:var(--maroon);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 14px}
.vp p{margin:0;font-family:'Amiri',serif;font-size:17px;line-height:1.85;color:var(--ink);text-align:justify;text-justify:inter-word}
.vp-sig{display:flex;flex-direction:column;gap:0;border-top:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding-top:8px;margin-top:4px}
.vp-sig b{color:var(--maroon);font-size:17px;font-weight:900}
.vp-sig span{color:var(--muted);font-size:13px}
.vp-ear svg{width:26px;height:70px;opacity:.9}
@media (max-width:700px){.vp{grid-template-columns:minmax(0,1fr);padding:20px}.vp-q{position:absolute;left:14px;top:6px;font-size:80px}.vp-ear{display:none}.vp p{font-size:16px}}
.vision{display:block;font-style:normal;color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.vis b{color:var(--gold-2);font-size:17px;font-weight:800}
.vis span{font-size:15px;opacity:.95}
.band-stat{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.glass{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:8px 16px}
.glass .ico{width:40px;height:40px;border-radius:12px;border:1px solid rgba(224,190,115,.5);display:grid;place-items:center;color:var(--gold-2)}
.glass .ico svg{width:20px;height:20px}
.glass .l{font-size:13px;line-height:1.4}.glass .l small{display:block;opacity:.75;font-size:11.5px}
.glass .n{font-size:28px;font-weight:900;color:var(--gold-2);font-variant-numeric:tabular-nums;border-inline-start:1px solid rgba(255,255,255,.2);padding-inline-start:14px}
.btn-gold{border:none;background:linear-gradient(180deg,#E7C77F,#C9A24A);color:#3A1A0B;font-weight:800;border-radius:12px;padding:9px 16px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.btn-gold svg{width:16px;height:16px}
/* header */
.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px}.bmark img{width:96px;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(98,16,42,.18))}
.brand h1{margin:0;font-family:var(--f-brand);font-weight:700;font-size:40px;line-height:1.45;padding-bottom:2px;background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{display:block;color:var(--maroon);opacity:.85;font-weight:700;font-size:14px}
.logo{height:84px;width:auto}
.logo-l{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-c{display:none}:root:not([data-theme="light"]) .logo-l{display:block}}
:root[data-theme="dark"] .logo-c{display:none}:root[data-theme="dark"] .logo-l{display:block}
/* nav */
.navwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:12px;border-bottom:1px solid var(--line)}
.nav{display:flex;gap:6px;overflow-x:auto;border:1.5px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:20px;padding:6px;background:var(--paper);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:14px;color:var(--maroon);font-weight:800;font-size:15px;white-space:nowrap;flex:none}
.nav button:hover{background:var(--maroon-soft)}
.nav button[aria-current="page"]{background:linear-gradient(180deg,#6E1432,#470A1E);color:#fff;box-shadow:0 6px 14px -8px rgba(122,20,52,.8)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .ic{width:18px;height:18px;flex:none}
/* main */
.main{padding-block:26px 50px}
.wrap{display:flex;flex-direction:column;gap:22px}
.foot{background:#14213D;border-top:3px solid #B8903A;color:#E9DCCB;font-size:13px}
.foot .in{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;padding-block:18px}
.foot b{color:var(--gold-2)}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--cream);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:16px;padding:10px 16px;font-size:14px}
.demo-bar b{color:var(--maroon)}
.crown{display:flex;flex-direction:column;gap:4px}
.crown .eyebrow{align-self:flex-start;background:var(--navy-soft);color:var(--navy-ink);font-weight:800;font-size:13px;border-radius:999px;padding:3px 14px}
.crown h2{font-family:var(--f-ui);font-weight:900;font-size:36px;line-height:1.3;margin:4px 0 0;color:var(--maroon);text-wrap:balance}
.crown p{margin:0;color:var(--muted);max-width:72ch}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);max-width:260px}
.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
.orn svg{width:12px;height:12px;flex:none}
.verse{font-family:var(--f-quran);color:var(--maroon);font-size:22px;line-height:2;margin:0}
.verse cite{font-family:var(--f-ui);font-style:normal;font-size:12.5px;color:var(--muted);margin-right:6px}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;color:var(--ink);padding:40px 44px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;min-height:360px;background:var(--hero-bg);border:1px solid var(--hero-line);box-shadow:0 24px 50px -34px rgba(138,21,56,.35)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 18% 40%,rgba(246,220,221,.55),transparent 70%),radial-gradient(50% 60% at 85% 100%,rgba(243,221,160,.35),transparent 70%);opacity:1}
.hero::after{content:"";position:absolute;inset:0;background:var(--hero-veil);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;color:var(--maroon);background:var(--sand);font-size:13.5px;font-weight:800;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:3px 14px;margin-bottom:8px}
.hero h2{font-family:var(--f-brand);font-size:80px;line-height:1.45;padding-bottom:4px;margin:0;font-weight:700;background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .verse{color:var(--hero-verse);font-size:24px;line-height:2.1}
.hero .verse cite{color:var(--muted)}
.hero p{margin:0;color:var(--hero-text);max-width:56ch}
.hero-field{display:flex;justify-content:center}
.hero-field svg,.emb3d{width:min(380px,100%);height:auto;filter:drop-shadow(0 22px 30px rgba(98,16,42,.22))}
.motto{grid-column:1/-1;display:flex;align-items:baseline;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.motto b{font-family:'Amiri',serif;font-weight:700;font-size:19px;color:var(--maroon)}
.motto i{font-family:var(--f-latin);font-size:17px;color:var(--gold);letter-spacing:.4px}
.motto-s{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.motto-s b{font-family:'Amiri',serif;color:var(--maroon);font-size:18px}.motto-s i{font-family:var(--f-latin);color:var(--gold);font-size:16px}
.hero-field svg.sheaf{width:min(320px,100%);height:auto;filter:drop-shadow(0 14px 22px rgba(120,80,20,.28))}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.tile .k{font-size:13.5px;color:var(--muted);font-weight:700}
.tiles .tile:nth-child(1){background:linear-gradient(160deg,var(--rose),var(--paper) 70%)}.tiles .tile:nth-child(3){background:linear-gradient(160deg,var(--sky),var(--paper) 70%)}.tiles .tile:nth-child(4){background:linear-gradient(160deg,var(--mint),var(--paper) 70%)}
.tile .v{font-size:36px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .s{font-size:13px;color:var(--muted)}
.tile.maroon .v{color:var(--maroon)}
.tile.navy{background:linear-gradient(160deg,var(--sand),var(--paper) 75%);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}.tile.navy .v{color:var(--maroon)}
.tile.gold .v{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent}
/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px 22px;min-width:0;box-shadow:var(--shadow)}
.panel h3{font-size:21px;margin:0 0 12px;font-weight:900;color:var(--maroon)}
.panel h3 small{font-size:13px;color:var(--muted);font-weight:500;margin-right:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;color:var(--maroon)}
.btn:hover{border-color:var(--gold)}
a.btn{text-decoration:none}
.btn.pri{background:linear-gradient(180deg,#6E1432,#470A1E);color:#fff;border-color:transparent}
.btn.gold{background:linear-gradient(180deg,#E7C77F,#C9A24A);color:#3A1A0B;border-color:transparent;font-weight:800}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.ghost{background:transparent}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
textarea{width:100%;min-height:200px;line-height:1.9}
.ears{display:inline-flex;gap:1px;align-items:flex-end}
.ears svg{width:12px;height:32px}
.ears.lg svg{width:17px;height:45px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:12.5px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gold{background:var(--cream);color:var(--maroon);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--navy-ink);font-weight:800;background:color-mix(in srgb,var(--cream) 55%,var(--paper));white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in srgb,var(--cream) 40%,transparent)}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:center}
.link{all:unset;cursor:pointer;font-weight:800;color:var(--ink);border-bottom:1.5px dashed color-mix(in srgb,var(--gold) 70%,transparent)}
.link:hover{color:var(--maroon)}
.muted{color:var(--muted)}.small{font-size:13px}.up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}

.rep table.pg>thead td,.rep table.pg>tfoot td,.rep table.pg>tbody>tr>td{padding:0 13mm}
.sp-top{height:33mm}.sp-bot{height:19mm}
.rep h1{margin:0 0 3mm;text-align:center;font-size:17pt;font-weight:800;color:#6E0F25;letter-spacing:0}
.rep .cap{position:absolute;top:30.5mm;left:13mm;width:14mm;height:14mm}
.rep.g12 h1{padding-left:22mm}
.who{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2mm;font-size:10.5pt;border-bottom:1.5px solid #B8903A;padding-bottom:2mm;margin-bottom:2mm}
.who b{color:#6E0F25}
.intro{font-size:9.5pt;line-height:1.75;margin:0 0 3mm;color:#3a2a30}
.rbox{border:1px solid #CDBFA6;border-radius:3mm;margin-bottom:2.6mm;overflow:hidden;break-inside:avoid;page-break-inside:avoid;background:rgba(255,255,255,.88)}
.rbox .rh{background:#F6EEDC;padding:1.4mm 3mm;font-size:10pt;font-weight:800;color:#3a2a30;display:flex;justify-content:space-between;align-items:center;gap:3mm}
.rbox .rh b{color:#6E0F25}
.rbox .tch{font-size:9pt;font-weight:700;color:#1F3A5F}

/* ---------- reading files ---------- */
function fixRef(ws){let Rr=0,C=0,any=false;for(const k in ws){if(k[0]==='!')continue;const a=XLSX.utils.decode_cell(k);any=true;if(a.r>Rr)Rr=a.r;if(a.c>C)C=a.c}if(any)ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Rr,c:C}})}
function readBook(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});const b={};wb.SheetNames.forEach(n=>{const ws=wb.Sheets[n];fixRef(ws);b[n]=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true})});res(b)}catch(e){rej(e)}};fr.onerror=rej;fr.readAsArrayBuffer(file)})}
function parseTeacher(b){const out={teacher:'',sheets:[]};
  Object.entries(b).forEach(([sn,rows])=>{const t=cell(rows[0]&&rows[0][0]);const m=t.match(/^رصد (.+?) — (.+?) — الشعبة\s*(1[0-2]-\d+)/);if(!m||/الملاحظات السلوكية/.test(t))return;
    const tn=cell(rows[1]&&rows[1][0]).match(/المعلمة:\s*(.+?)\s*\|/);if(tn)out.teacher=tn[1].trim();
    const H=(rows[3]||[]).map(cell);const choose=H[3]==='هل تدرس الطالبة المادة لديكِ؟';const stu=[];
    for(let i=4;i<rows.length;i++){const r=rows[i];const pid=cell(r[1]);if(!/^\d{6,}$/.test(pid))break;const v={};H.forEach((h,j)=>{if(j>=3&&h)v[h]=cell(r[j])});stu.push({pid,n:cell(r[2]),v})}
    let blanks=0,total=0;stu.forEach(s=>{if(choose){const yn=s.v[H[3]];if(!yn){blanks++;total++;return}total++;if(yn==='لا')return}H.slice(choose?4:3).forEach(h=>{if(!h)return;total++;if(s.v[h]==='')blanks++})});
    out.sheets.push({sec:m[3],subj:m[2].trim(),choose,H:H.slice(3),stu,blanks,total})});
  return out.sheets.length?out:null}
function parseSW(b){const out={};let found=false;Object.entries(b).forEach(([sn,rows])=>{const t=cell(rows[0]&&rows[0][0]);const m=t.match(/^رصد الملاحظات السلوكية — .+? — الشعبة\s*(1[0-2]-\d+)/);if(!m)return;found=true;
  const notes={};let i=4;for(;i<rows.length;i++){const r=rows[i];const pid=cell(r[1]);if(!/^\d{6,}$/.test(pid))break;const ns=[cell(r[3]),cell(r[4])].filter(Boolean);if(ns.length)notes[pid]=ns}
  const done=rows.slice(i,i+3).some(r=>r.some(c=>cell(c)==='تم الانتهاء'));out[m[1]]={notes,done}});return found?out:null}
async function handleFiles(files){let ok=0,bad=[];for(const f of files){try{const b=await readBook(f);const s=parseSW(b);if(s){R.sw={file:f.name,at:new Date().toISOString(),secs:s};ok++;continue}
    const t=parseTeacher(b);
    if(t){R.files[norm(t.teacher)||f.name]={teacher:t.teacher,file:f.name,at:new Date().toISOString(),sheets:t.sheets};ok++;continue}
    bad.push(f.name)}catch(e){console.error(e);bad.push(f.name)}}
  save();toast('تم استيراد '+ok+' ملف'+(bad.length?' — لم يُتعرَّف على: '+bad.join('، '):''));render()}

/* ---------- model ---------- */
function teachersExpected(){const{list,coord}=staff();const leave=new Set(R.set.leave.split(/[،,]/).map(norm).filter(Boolean));
  return list.filter(t=>(t.sections||[]).length&&!leave.has(norm(t.name))).map(t=>{const cn=coord[t.dept];const c=cn&&cn!==t.name?list.find(x=>x.name===cn):null;return Object.assign({},t,{coordName:c?c.name:'',coordMail:c?c.email:'',isCoord:cn===t.name,noCoord:!cn})})}
function teacherStatus(){return teachersExpected().map(t=>{const f=R.files[norm(t.name)];if(!f)return Object.assign(t,{st:'none',blanks:null,sheets:[]});
  const bl=f.sheets.reduce((s,x)=>s+x.blanks,0),tot=f.sheets.reduce((s,x)=>s+x.total,0);return Object.assign(t,{st:bl===0?'done':'part',blanks:bl,total:tot,sheets:f.sheets,at:f.at})})}
function entries(){const E={};Object.values(R.files).forEach(f=>f.sheets.forEach(sh=>sh.stu.forEach(s=>{const yn=sh.choose?s.v['هل تدرس الطالبة المادة لديكِ؟']:'نعم';if(yn!=='نعم')return;
  (E[s.pid]=E[s.pid]||{n:s.n,sec:sh.sec,subs:{}}).subs[sh.subj]={teacher:f.teacher,v:s.v}})));return E}
function students(sec){const a=A();const E=entries();const out=new Map();
  Object.entries(a.reg||{}).forEach(([pid,r])=>{if(r.s===sec)out.set(pid,{pid,n:r.n,nat:r.nat})});
  Object.entries(E).forEach(([pid,e])=>{if(e.sec===sec&&!out.has(pid))out.set(pid,{pid,n:e.n,nat:''})});
  return[...out.values()].sort((x,y)=>x.n.localeCompare(y.n,'ar'))}
const fq=v=>v==='دائماً'?2:v==='أحياناً'?1:v==='نادراً'?0:null;
function commit(subj,v){const g=k=>v[Object.keys(v).find(h=>h.startsWith(k))||'__'];
  if(subj==='التربية البدنية'){const a=fq(g('الالتزام بالزي')),b=fq(g('التفاعل')),c=g('السلوك في القاعة');if(a==null||b==null||!c)return null;const s=a+b+(c==='ملتزمة'?2:0);return s>=5?'ملتزمة':s>=3?'ملتزمة إلى حد ما':'غير ملتزمة'}
  const hw=Object.keys(v).filter(h=>/^واجب/.test(h)).map(h=>num(v[h]));const part=num(g('المشاركة')),books=fq(g('إحضار')),beh=g('سلوك الطالبة');
  if(books==null||!beh)return null;const hwMax=hw.length*2;const hwS=hw.reduce((s,x)=>s+(x||0),0);
  let s=books+(beh==='ملتزمة'?2:0)+(part==null?1:part>=4?2:part>=2.5?1:0)+(hwMax?(hwS/hwMax>=.75?2:hwS/hwMax>=.5?1:0):1);
  const c=s>=7?'ملتزمة':s>=4?'ملتزمة إلى حد ما':'غير ملتزمة';return beh!=='ملتزمة'&&c==='ملتزمة'?'ملتزمة إلى حد ما':c}
function assessPct(v){const a=num(v['التقييم الأول (من 20)']),b=num(v['التقييم الثاني (من 20)']);const xs=[a,b].filter(x=>x!=null);return xs.length?xs.reduce((s,x)=>s+x,0)/(xs.length*20)*100:null}
function studentReport(st,sec){const E=entries()[st.pid]||{subs:{}};const a=A();const per=REPORTS[R.rep].mid;const cur=((a.cur||{})[per]||{})[st.pid];const g12=sec.startsWith('12');
  const h=hash(st.pid);const subs=Object.keys(E.subs).sort(subjSort);
  const items=subs.map((s,i)=>{const e=E.subs[s];const c=commit(s,e.v);const ap=assessPct(e.v);const mid=cur&&typeof cur.g[s]==='number'?cur.g[s]:null;
    let ph=c?PH[c][(h+i*3)%10]:'';let mis='';if(!g12&&mid!=null&&ap!=null){if(mid-ap>=20)mis=MIS_HI;else if(ap-mid>=20)mis=MIS_LO}
    return{s,teacher:e.teacher,v:e.v,c,ap,mid,ph,mis}});
  const sw=R.sw&&R.sw.secs[sec]?(R.sw.secs[sec].notes[st.pid]||[]):null;
  const lv=items.map(x=>x.mid!=null&&x.ap!=null?(x.mid+x.ap)/2:x.mid!=null?x.mid:x.ap).filter(x=>x!=null);const avg=lv.length?lv.reduce((s,x)=>s+x,0)/lv.length:null;
  const goodC=items.filter(x=>x.c==='ملتزمة').length,badC=items.filter(x=>x.c==='غير ملتزمة').length;
  const g12lv=items.map(x=>x.v['المستوى الأكاديمي العام']).filter(Boolean);
  const high=g12?(g12lv.filter(x=>/ممتاز|جيد جداً/.test(x)).length>=g12lv.length*.7&&badC===0):(avg!=null&&avg>=85&&badC===0);
  return{st,sec,items,sw,avg,goodC,badC,closing:high?CL_HI:CL_LO,g12}}

function chart(items,g12){const it=items.filter(x=>x.ap!=null||x.mid!=null);if(!it.length)return'';const W=680,lw=170,rh=g12?20:30,H=it.length*rh+26,sx=v=>(W-lw-40)*Math.max(0,Math.min(100,v))/100;

  it.forEach((x,i)=>{const y=i*rh+4;g+='<text x="'+(W-2)+'" y="'+(y+11)+'" font-size="11.5" font-weight="700" text-anchor="end" fill="#2A1820">'+esc(x.s)+'</text>';

    if(!g12&&x.mid!=null){g+='<rect x="'+(W-lw-sx(x.mid))+'" y="'+(y+12)+'" width="'+sx(x.mid)+'" height="10" rx="3" fill="#1F3A5F"/><text x="'+(W-lw-sx(x.mid)-4)+'" y="'+(y+21)+'" font-size="9.5" text-anchor="end" fill="#16233F">'+fmt(x.mid)+'</text>'}});
  return'<div class="rbox chartbox"><div class="rh">الأداء في المواد</div><div class="lg"><span><i style="background:#0ABAB5"></i>التقييمات القصيرة</span>'+(g12?'':'<span><i style="background:#1F3A5F"></i>منتصف الفصل الدراسي الأول</span>')+'</div>'+g+'</svg></div>'}
function subjBox(x,g12){const v=x.v;const head='<div class="rh"><span>موجز عن أداء الطالبة في مادة (<b>'+esc(x.s)+'</b>)</span><span class="tch">معلمة المادة: أ. '+esc(x.teacher)+'</span></div>';
  let acad='';
  if(x.s==='التربية البدنية'){acad='<table><tr><th>الالتزام بالزي الرياضي</th><th>التفاعل أثناء الحصة</th><th>السلوك في القاعة الرياضية</th>'+(g12?'<th>المستوى العام</th>':'')+'</tr><tr><td>'+esc(v['الالتزام بالزي الرياضي'])+'</td><td>'+esc(v['التفاعل أثناء الحصة'])+'</td><td>'+esc(v['السلوك في القاعة الرياضية'])+'</td>'+(g12?'<td>'+esc(v['المستوى الأكاديمي العام']||'')+'</td>':'')+'</tr></table>'}
  else{const keys=Object.keys(v).filter(h=>/\(من \d+\)/.test(h));
    acad='<table class="ac"><tr>'+(!g12&&x.mid!=null?'<th class="mid">منتصف الفصل /30</th>':'')+keys.map(k=>'<th>'+esc(k.replace(/\s*\(من (\d+)\)/,'/$1'))+'</th>').join('')+(g12?'<th class="mid">المستوى العام</th>':'')+'</tr><tr>'+(!g12&&x.mid!=null?'<td class="mid">'+fmt(x.mid*0.3)+'</td>':'')+keys.map(k=>'<td>'+esc(v[k])+'</td>').join('')+(g12?'<td class="mid">'+esc(v['المستوى الأكاديمي العام']||'—')+'</td>':'')+'</tr></table>'+
      '<table><tr><th>إحضار الأدوات والكتاب المدرسي والدفاتر</th><th>سلوك الطالبة في الصف</th></tr><tr><td>'+esc(v['إحضار الأدوات والكتاب المدرسي والدفاتر'])+'</td><td>'+esc(v['سلوك الطالبة في الصف'])+'</td></tr></table>'}
  return'<div class="rbox">'+head+acad+(x.ph||x.mis?'<div class="ph">'+esc(x.ph)+(x.mis?' '+esc(x.mis):'')+'</div>':'')+'</div>'}

  return head('الملفات','ارفعي ملفات رصد المعلمات وملف الأخصائيتين كما وصلتكِ من التيمز، دفعة واحدة أو على مراحل. الملف الجديد للمعلمة نفسها يحل محل القديم.')+
  '<label class="drop" data-drop="1"><h4>ملفات الرصد</h4><div class="stl">اسحبي الملفات هنا (يمكن اختيار عشرات الملفات مرة واحدة).</div><input type="file" accept=".xlsx" multiple><span class="btn">اختيار الملفات</span></label>'+
  '<div class="box"><h3>الإعدادات</h3><div class="setg">'+
   '<label>التقرير الحالي<select data-set="rep">'+REPORTS.map((r,i)=>'<option value="'+i+'"'+(i===R.rep?' selected':'')+'>'+r.n+' — قبل '+r.exam+'</option>').join('')+'</select></label>'+
   '<label>آخر موعد للرصد (يظهر في رسالة التذكير)<input data-set="due" value="'+esc(R.set.due)+'" placeholder="الخميس 12 نوفمبر 2026"></label>'+
   '<label>بريدكِ (نسخة رسائل الأقسام التي ليس لها منسقة)<input data-set="vpMail" value="'+esc(R.set.vpMail)+'" placeholder="name@education.qa" dir="ltr"></label>'+
   '<label>بريد مديرة المدرسة (نسخة رسائل الأقسام التي ليس لها منسقة)<input data-set="prMail" value="'+esc(R.set.prMail)+'" placeholder="name@education.qa" dir="ltr"></label>'+
   '<label>معلمات في إجازة (لا يُطلب منهن الرصد)<input data-set="leave" value="'+esc(R.set.leave)+'"></label></div></div>'+
  '<div class="box"><h3>الملفات المستلمة ('+fs.length+(R.sw?' + ملف الأخصائيتين':'')+')</h3>'+(fs.length?'<div class="tw"><table class="gt"><thead><tr><th>المعلمة</th><th>الأوراق</th><th>تاريخ الرفع</th></tr></thead><tbody>'+fs.map(f=>'<tr><td class="nm">'+esc(f.teacher)+'</td><td>'+f.sheets.map(s=>s.sec).join('، ')+'</td><td>'+new Date(f.at).toLocaleString('ar-QA',{dateStyle:'medium',timeStyle:'short'})+'</td></tr>').join('')+'</tbody></table></div>':'<p class="stl">لا توجد ملفات بعد.</p>')+
  '<div class="chips"><button class="btn" data-wipe="1" style="color:var(--bad)">مسح ملفات هذا التقرير</button></div></div>'}

/* ---------- shell ---------- */
const TABS=[['status','حالة الرصد'],['reports','تقارير أولياء الأمور'],['files','الملفات والإعدادات']];
function render(){try{$('#nav').innerHTML=TABS.map(([id,l])=>'<button type="button" data-tab="'+id+'"'+(UI.tab===id?' aria-current="page"':'')+'>'+l+'</button>').join('')+'<a class="backlink" href="./">العودة إلى سبع سنابل ←</a>';
  $('#view').innerHTML={status:vStatus,reports:vReports,files:vFiles}[UI.tab]();
  const T=teacherStatus();$('#marq').textContent='التقرير الأكاديمي السلوكي · '+REPORTS[R.rep].n+' · '+T.filter(t=>t.st==='done').length+' معلمة أنهت الرصد من '+T.length+' · «إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا»'}catch(e){console.error(e);$('#view').innerHTML='<div class="box"><div class="empty">حدث خطأ: '+esc(e.message)+'</div></div>'}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toastRoot').appendChild(t);setTimeout(()=>t.remove(),4500)}
function openMsg(t){const k=t.st==='done'?'thanks':'remind';const m=mailParts(t,k);const q=s=>encodeURIComponent(s);
  const mailto='mailto:'+m.to+'?'+(m.cc?'cc='+q(m.cc)+'&':'')+'subject='+q(m.subj)+'&body='+q(m.body);
  const owa='https://outlook.office.com/mail/deeplink/compose?to='+q(m.to)+(m.cc?'&cc='+q(m.cc):'')+'&subject='+q(m.subj)+'&body='+q(m.body);
  $('#modalRoot').innerHTML='<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-label="الرسالة"><h3>'+(k==='thanks'?'رسالة شكر':'رسالة تذكير')+' — '+esc(short(t.name))+'</h3><div class="stl">إلى: <b dir="ltr">'+esc(m.to||'— لا يوجد بريد')+'</b>'+(m.cc?'<br>نسخة: <b dir="ltr">'+esc(m.cc)+'</b>':'')+'<br>الموضوع: <b>'+esc(m.subj)+'</b></div><pre class="spec">'+esc(m.body)+'</pre><div class="chips"><a class="btn pri" href="'+esc(mailto)+'">فتح في تطبيق Outlook</a><a class="btn" href="'+esc(owa)+'" target="_blank" rel="noopener">فتح في Outlook على المتصفح</a><button class="btn" data-copy="'+esc(m.body)+'">نسخ النص</button><button class="btn" data-copy="'+esc([m.to,m.cc].filter(Boolean).join(';'))+'">نسخ العناوين</button><button class="btn" data-close="1">إغلاق</button></div></div></div>'}
function bulk(kind){const T=teacherStatus().filter(t=>kind==='thanks'?t.st==='done':t.st!=='done');if(!T.length){toast('لا توجد معلمات في هذه القائمة');return}
  const to=T.map(t=>t.email).filter(Boolean),cc=[...new Set(T.map(t=>mailParts(t,kind).cc).join(';').split(';').filter(Boolean))];
  const rep=REPORTS[R.rep].n;const subj=kind==='thanks'?'شكر وتقدير — إنجاز رصد '+rep:'تذكير — استكمال رصد '+rep+' الأكاديمي السلوكي';
  const body=kind==='thanks'?'الأستاذات الفاضلات المحترمات\nالسلام عليكم ورحمة الله وبركاته،\n\nنتقدم إليكنّ بخالص الشكر والتقدير على إنجاز رصد '+rep+' الأكاديمي السلوكي، وقد تم استلام الرصد مكتملاً.\n\nوتفضلن بقبول فائق الاحترام والتقدير،\nالنائبة الأكاديمية\nآسيا الذبياني':'الأستاذات الفاضلات المحترمات\nالسلام عليكم ورحمة الله وبركاته،\n\nنود إحاطتكنّ علماً بأن رصد '+rep+' الأكاديمي السلوكي ما زال بحاجة إلى استكمال.\n'+(R.set.due?'علماً بأن آخر موعد للرصد هو '+R.set.due+'.\n':'')+'يرجى استكمال الرصد في أقرب وقت، حرصاً على إصدار التقارير لأولياء الأمور في موعدها.\n\nوتفضلن بقبول فائق الاحترام والتقدير،\nالنائبة الأكاديمية\nآسيا الذبياني';
  const q=s=>encodeURIComponent(s);
  $('#modalRoot').innerHTML='<div class="scrim" data-close="1"><div class="modal"><h3>'+(kind==='thanks'?'رسالة شكر جماعية':'رسالة تذكير جماعية')+' — '+T.length+' معلمة</h3><p class="stl">تُرسل لكل المعلمات في رسالة واحدة، والمنسقات نسخة. للرسالة الفردية بتفاصيل كل معلمة استخدمي زر الرسالة في جدولها.</p><pre class="spec">'+esc(body)+'</pre><div class="chips"><a class="btn pri" href="'+esc('https://outlook.office.com/mail/deeplink/compose?to='+q(to.join(';'))+'&cc='+q(cc.join(';'))+'&subject='+q(subj)+'&body='+q(body))+'" target="_blank" rel="noopener">فتح في Outlook على المتصفح</a><button class="btn" data-copy="'+esc(to.join(';'))+'">نسخ عناوين المعلمات</button><button class="btn" data-copy="'+esc(cc.join(';'))+'">نسخ عناوين النسخة</button><button class="btn" data-copy="'+esc(body)+'">نسخ النص</button><button class="btn" data-close="1">إغلاق</button></div></div></div>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-sec],[data-msg],[data-bulk],[data-copy],[data-close],[data-print],[data-wipe]');if(!b)return;
  if(b.dataset.close!=null&&(e.target===b||b.tagName==='BUTTON')){$('#modalRoot').innerHTML='';return}
  if(b.dataset.tab){UI.tab=b.dataset.tab;render();scrollTo({top:0})}
  else if(b.dataset.sec){UI.sec=b.dataset.sec;UI.stu='';render()}
  else if(b.dataset.msg){const t=teacherStatus().find(x=>x.name===b.dataset.msg);if(t)openMsg(t)}
  else if(b.dataset.bulk)bulk(b.dataset.bulk);
  else if(b.dataset.copy!=null){navigator.clipboard.writeText(b.dataset.copy).then(()=>toast('تم النسخ'),()=>toast('تعذّر النسخ'))}
  else if(b.dataset.print)window.print();
  else if(b.dataset.wipe){if(confirm('مسح جميع ملفات الرصد المرفوعة لهذا التقرير؟')){R.files={};R.sw=null;save();render()}}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.set){R.set[t.dataset.set]=t.value;if(t.dataset.set==='rep'){R.rep=+t.value}save();if(t.dataset.set==='rep')render()}
  else if(t.dataset.stu!=null){UI.stu=t.value;render()}
  else if(t.closest('[data-drop]')&&t.files&&t.files.length){handleFiles([...t.files]);t.value=''}});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}}));
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.remove('over');handleFiles([...e.dataTransfer.files])}});
render();

</script>
</body></html>
