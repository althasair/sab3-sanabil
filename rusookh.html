<script>
(()=>{
/* ===== طبقة البيانات الحية: تُحسب من بيانات سنابل التي ترسلها الصفحة الرئيسية ===== */
let D=[],LV=null,SC=[],SCI=[],LIT=[],PY='',CY='',TT=0,DENT=30,TN='',AVAIL=[],SIG='',RAW=null;
const PERIODS=['منتصف الفصل الأول','نهاية الفصل الأول','منتصف الفصل الثاني','نهاية الفصل الثاني'];
const norm=s=>String(s||'').replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,' ').trim();
function key10(x){const n=norm(x);if(/فيزياء/.test(n))return'phy';if(/كيمياء/.test(n))return'chem';if(/احياء/.test(n))return'bio';if(/تاريخ/.test(n))return'hist';if(/جغراف/.test(n))return'geo';
 if(/اجتماع/.test(n))return'soc';if(/حوسب|حاسب|تكنولوج/.test(n))return'comp';if(/علوم/.test(n))return'sci';if(/رياضيات/.test(n))return'math';if(/عربي/.test(n))return'ar';if(/انجليز/.test(n))return'en';if(/اسلامي/.test(n))return'isl';if(/اداره|اعمال/.test(n))return'bus';return''}
function key11(x){const n=norm(x);if(/علوم العامه/.test(n))return'gsci';if(/رياضيات العامه/.test(n))return'gmath';return key10(x)}
const yl=y=>String(y).replace('-','–');const g10=s=>/^10\s*[-–\/]/.test(String(s)),g11=s=>/^11\s*[-–\/]/.test(String(s));
function build(){const R=RAW.roster||[],HH=RAW.hist||{};PY=Object.keys(HH).filter(y=>/^\d{4}-\d{4}$/.test(y)).sort().pop()||'';const H=PY?HH[PY]:[];
 const y1=+PY.slice(0,4)+1;CY=y1?y1+'–'+(y1+1):'';PY=yl(PY);
 AVAIL=[0,1,2,3].filter(t=>R.some(r=>r.scores&&r.scores[t]!=null)&&H.some(r=>r.scores&&r.scores[t]!=null));if(!AVAIL.includes(TT))TT=AVAIL.length?AVAIL[AVAIL.length-1]:0;
 TN=PERIODS[TT];DENT=[30,50,30,50][TT];
 const pc=r=>{const v=r.scores&&r.scores[TT];return v==null||v===''||isNaN(+v)?null:+v};
 /* المستوى بين العامين */
 const lvl=(rows,isG,kf,ks)=>{const out={},ids=new Set();rows.forEach(r=>{if(!isG(r.section))return;const p=pc(r);if(p==null)return;const k=kf(r.subject);if(!k)return;(out[k]=out[k]||[]).push(p);ids.add(r.idh||norm(r.name))});return{out,n:ids.size}};
 const S=v=>v&&v.length?{n:v.length,m:v.reduce((a,b)=>a+b,0)/v.length,c90:v.filter(x=>x>=90).length,c70:v.filter(x=>x<70).length,c50:v.filter(x=>x<50).length}:null;
 const a10=lvl(H,g10,key10),b10=lvl(R,g10,key10),a11=lvl(H,g11,key11),b11=lvl(R,g11,key11);
 const L10=[['sci','العلوم'],['math','الرياضيات'],['ar','اللغة العربية'],['en','اللغة الإنجليزية'],['isl','التربية الإسلامية'],['soc','الدراسات الاجتماعية'],['comp','الحوسبة وتكنولوجيا المعلومات']].map(([k,l])=>({k,l,a:S(a10.out[k]),b:S(b10.out[k])}));
 const pool=(o,ks)=>ks.reduce((a,k)=>a.concat(o[k]||[]),[]);
 const L11=[['sci','العلوم (فيزياء وكيمياء وأحياء)',['phy','chem','bio']],['phy','الفيزياء'],['chem','الكيمياء'],['bio','الأحياء'],['gsci','العلوم العامة (أدبي)'],['math','الرياضيات (علمي)'],['gmath','الرياضيات العامة (أدبي)'],['ar','اللغة العربية'],['en','اللغة الإنجليزية'],['isl','التربية الإسلامية'],['hist','التاريخ'],['geo','الجغرافيا'],['comp','الحوسبة وتكنولوجيا المعلومات'],['bus','إدارة الأعمال']]
  .map(([k,l,ks])=>{const a=S(ks?pool(a11.out,ks):a11.out[k]),b=S(ks?pool(b11.out,ks):b11.out[k]);if(ks){if(a)a.n=(a11.out.phy||[]).length;if(b)b.n=(b11.out.phy||[]).length}return{k,l,a,b}});
 LV={g10:L10,g11:L11,n10:[a10.n,b10.n],n11:[a11.n,b11.n]};
 /* دفعة المشروع: الطالبة نفسها */
 const prev=new Map(),prevN=new Map();H.forEach(r=>{if(!g10(r.section))return;const k=r.idh||'n:'+norm(r.name);let o=prev.get(k);if(!o){o={s10:r.section,v:{}};prev.set(k,o);prevN.set(norm(r.name),o)}const kk=key10(r.subject),p=pc(r);if(kk&&p!=null)(o.v[kk]=o.v[kk]||[]).push(p)});
 const cur=new Map();R.forEach(r=>{if(!g11(r.section))return;const k=r.idh||'n:'+norm(r.name);let o=cur.get(k);if(!o){o={n:r.name,s:r.section,v:{},raw:{}};cur.set(k,o)}const kk=key11(r.subject),p=pc(r);if(kk&&p!=null){(o.v[kk]=o.v[kk]||[]).push(p);if(['phy','chem','bio'].includes(kk))o.raw[kk]=r.raw&&r.raw[TT]!=null?+r.raw[TT]:p*DENT/100}});
 const m=a=>a&&a.length?a.reduce((x,y)=>x+y,0)/a.length:null;const grp=(v,ks)=>m(ks.reduce((a,k)=>a.concat(v[k]||[]),[]));
 const MAP={sci:[['sci'],['phy','chem','bio']],math:[['math'],['math','gmath']],ar:[['ar'],['ar']],en:[['en'],['en']],isl:[['isl'],['isl']],soc:[['soc'],['hist','geo']],comp:[['comp'],['comp']]};
 D=[];cur.forEach((c,k)=>{const o=prev.get(k)||prevN.get(norm(c.n));if(!o)return;const g={};Object.entries(MAP).forEach(([kk,[pk,ck]])=>{const a=grp(o.v,pk),b=grp(c.v,ck);g[kk]=a!=null||b!=null?[a,b]:null});
  const sideAvg=i=>m(Object.values(g).filter(v=>v&&v[i]!=null).map(v=>v[i]));const sci=c.v.phy||c.v.chem||c.v.bio;
  const x={n:c.n,s:c.s,s10:o.s10,tr:sci?'علمي':'أدبي',g,avg:[sideAvg(0),sideAvg(1)]};if(sci&&c.raw.phy!=null)x.det={phy:c.raw.phy,chem:c.raw.chem,bio:c.raw.bio};D.push(x)});
 D.forEach(x=>{['sci','math','ar','en','isl','soc','comp'].forEach(k=>{const v=x.g[k];if(v&&(v[0]==null||v[1]==null))x.g[k]=v[0]==null&&v[1]==null?null:v})});
 D.forEach(x=>{if(x.det){x.g.phy=[x.g.sci&&x.g.sci[0],x.det.phy/DENT*100];x.g.chem=[x.g.sci&&x.g.sci[0],x.det.chem/DENT*100];x.g.bio=[x.g.sci&&x.g.sci[0],x.det.bio/DENT*100]}x.g.avg_=x.avg});
 SC=D.filter(x=>x.det&&x.g.sci&&x.g.sci[0]!=null&&x.g.sci[1]!=null);SCI=D.filter(x=>x.tr==='علمي');LIT=D.filter(x=>x.tr==='أدبي')}
const dw=(d,u,dn,eq)=>d>=1?u:d<=-1?dn:eq;

const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=x=>x==null?'—':(Math.round(x*10)/10).toLocaleString('en-US',{maximumFractionDigits:1});const pap=p=>p==null?'—':f1(Math.round(p*DENT/100*2)/2);
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const NM={sci:'العلوم',phy:'الفيزياء',chem:'الكيمياء',bio:'الأحياء',math:'الرياضيات',ar:'اللغة العربية',en:'اللغة الإنجليزية',isl:'التربية الإسلامية',soc:'الاجتماعيات',comp:'الحوسبة وتكنولوجيا المعلومات'};
const ALL=['sci','math','ar','en','isl','soc','comp'];
const cls=d=>d==null?'':d>=1?'up':d<=-1?'dn':'eq';const chg=d=>d==null?'—':'<span class="chg '+cls(d)+'">'+(d>=1?'▲ ':d<=-1?'▼ ':'= ')+f1(Math.abs(d))+'</span>';
/* القيم الفرعية للعلوم من درجات الورقة */

function st(k,P){P=P||D;const L=P.map(x=>x.g[k]).filter(v=>v&&v[0]!=null&&v[1]!=null);if(!L.length)return null;const a=mean(L.map(v=>v[0])),b=mean(L.map(v=>v[1]));const d=L.map(v=>v[1]-v[0]);
  return{n:L.length,a,b,d:b-a,up:d.filter(x=>x>=1).length,eq:d.filter(x=>x>-1&&x<1).length,dn:d.filter(x=>x<=-1).length,a90:L.filter(v=>v[0]>=90).length,b90:L.filter(v=>v[1]>=90).length,a70:L.filter(v=>v[0]<70).length,b70:L.filter(v=>v[1]<70).length}}
/* الفيزياء والكيمياء والأحياء مقارنةً بعلوم العاشر نفسها */

function bars(items,o={}){/* items:{l,a,b} أعمدة أفقية مزدوجة: العاشر (كحلي) والحادي عشر (فيروزي) */const W=900,lw=o.lw||200,rh=items.some(i=>i.b!=null)?46:32,H=items.length*rh+28,sx=v=>(W-lw-50)*Math.max(0,Math.min(100,v))/100;
  let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.t||'رسم')+'" style="direction:ltr">';[0,25,50,75,100].forEach(t=>{const x=W-lw-sx(t);g+='<line x1="'+x+'" x2="'+x+'" y1="2" y2="'+(H-20)+'" stroke="#EFE6D6"/><text x="'+x+'" y="'+(H-5)+'" font-size="11" text-anchor="middle" fill="#9A8C90">'+t+'</text>'});
