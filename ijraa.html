<style>

body.pr .kpis{grid-template-columns:repeat(6,1fr);gap:2mm;margin:2mm 0}body.pr .kpi{padding:1.5mm 1mm;border-radius:3mm}body.pr .kpi .v{font-size:15pt}body.pr .kpi .l{font-size:8pt}

body.pr .tw{overflow:visible;break-inside:avoid}

body.pr .cards{gap:2.5mm}body.pr .card{padding:2mm 3mm;border-radius:3mm}body.pr .card .hd b{font-size:10.5pt}body.pr .card li{font-size:9pt;line-height:1.55}body.pr .ears img{height:5.5mm}body.pr .lv{font-size:8.5pt}body.pr .lv img{height:4.5mm}

.sig .nm img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:24mm;max-width:60mm;object-fit:contain;opacity:.7;mix-blend-mode:multiply}

</style></head><body>
<header class="top"><h1>إجراءات رفع التحصيل الأكاديمي</h1><div class="sub">سبع سنابل · الربع الأول والربع الثاني · العام الأكاديمي 2026–2027</div>
<div class="verse">﴿ وَاللَّهُ يُضَاعِفُ لِمَن يَشَاءُ ﴾ <small>[البقرة: 261]</small></div></header>
<div class="wrap"><nav class="dp" id="dp"></nav><div class="qtabs" id="qt"></div><main id="app"></main>
<div class="foot">إعداد النائبة الأكاديمية أ. آسيا الذبياني · مصدر البيانات: منصة سبع سنابل · <span id="sv"></span></div></div>
<script>
(function(){
/* ---------- بناء بيانات التقرير من بيانات سبع سنابل (الإجراءات، الطاقم، السجل) ---------- */
const QDEF=[{k:'1',from:'2026-08-15',to:'2026-10-11'},{k:'2',from:'2026-10-12',to:null}];
const DORDER=['اللغة العربية','اللغة الإنجليزية','الرياضيات','التربية الإسلامية','الفيزياء','الكيمياء','الأحياء','العلوم الاجتماعية','الحوسبة وتكنولوجيا المعلومات','إدارة الأعمال','المهارات الحياتية والمهنية','الفنون البصرية','التربية البدنية'];
function buildData(R){
 const nz=s=>String(s==null?'':s).replace(/[ً-ٰـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ئ/g,'ا').replace(/عااشه/g,'عاشه').replace(/\s+/g,' ').trim();
 const p2=n=>String(n).padStart(2,'0');
 const pd=s=>{s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d\d)-(\d\d)/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d+)\/(\d+)\/(\d+)/);if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+p2(m[1])+'-'+p2(m[2])}return null};
 const now=new Date();const TODAY=now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate());
 const qOf=d=>{for(const q of QDEF){if(d>=q.from&&(!q.to||d<=q.to))return q.k}return null};
 const toks=n=>{const o=[];nz(n).split(' ').forEach(w=>{if(o.length&&['عبد','ابو','ام'].includes(o[o.length-1]))o[o.length-1]+=w;else if(w)o.push(w)});return o};
 const staff=R.staff||[];const ST=staff.map(s=>[s,toks(s.name)]);const cache=new Map();
 const who=n=>{const k=nz(n);if(cache.has(k))return cache.get(k);const t=toks(n);let best=null,bs=0;
  if(t.length)for(const [s,st] of ST){if(!st.length||t[0]!==st[0])continue;let sc=2;for(const w of t.slice(1))if(st.slice(1).includes(w))sc++;if(t.length>1&&t[t.length-1]===st[st.length-1])sc++;if(sc>bs){bs=sc;best=s}}
  const r=(bs>=3||(best&&t.length===1))?best:null;cache.set(k,r);return r};
 const short=n=>{let t=[];String(n).split(/\s+/).forEach(w=>{if(t.length&&['عبد','ابو','أبو','ام'].includes(t[t.length-1]))t[t.length-1]+=w;else if(w)t.push(w)});if(t.length>3&&t[t.length-1]==='الله')t.splice(-2,2,t[t.length-2]+' الله');return t.length<=3?t.join(' '):[t[0],t[1],t[t.length-1]].join(' ')};
 const acts=[],seen=new Set();
 (R.actions||[]).forEach(a=>{if(a.back&&!a.ok)return;const d=pd(a.date);if(!d||d<QDEF[0].from||d>TODAY)return;const q=qOf(d);if(!q)return;const t=who(a.teacher);if(!t)return;
  const det=String(a.detail||'').replace(/\s+/g,' ').trim();const stu=(a.students||[]).filter(Boolean);
  const key=[t.name,d,nz(a.section),a.type,nz(det),stu.map(nz).sort().join('|')].join('¦');if(seen.has(key))return;seen.add(key);
  acts.push({t:t.name,d,q,k:+a.type,sec:a.section||'',det,stu,whole:!!a.whole,cnt:+a.cnt||0})});
 (R.evals||[]).forEach(e=>{if(+e.type!==9)return;const d=pd(e.date);const t=who(e.teacher||e.byName);if(!d||!t||d>TODAY)return;const q=qOf(d);if(!q)return;
  const key=['ev',t.name,d,(e.students||[]).join('|'),e.subject].join('¦');if(seen.has(key))return;seen.add(key);
  acts.push({t:t.name,d,q,k:1,sec:e.section||'',det:'تحليل الورقة الاختبارية للطالبة وتحديد مواطن الضعف',stu:e.students||[],whole:false,cnt:0,pa:1})});
 const sk=s=>nz(s).replace(/\//g,'-');
 const tg=new Map();(R.roster||[]).forEach(r=>{const t=who(r.teacher);if(!t)return;if(String(r.section).startsWith('12'))return;const sc=r.scores?r.scores[0]:null;
  if(sc!=null&&sc<70){if(!tg.has(t.name))tg.set(t.name,new Map());tg.get(t.name).set(nz(r.name)+'¦'+sk(r.section),[nz(r.name),sk(r.section),r.name,sc,r.raw?r.raw[0]:null,r.den?r.den[0]:null])}});
 const nm=(a,b)=>{const ta=a.split(' '),tb=b.split(' ');return (ta[0]===tb[0]&&ta[1]===tb[1])||a.includes(b)||b.includes(a)};
 const seg=(det,i)=>{const p=det.split(' — ').map(x=>x.trim());return p[i]||''};
 const topOf=(B,f,n)=>{const c=new Map();B.forEach(a=>{const x=f(a);if(x)c.set(x,(c.get(x)||0)+1)});return [...c.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0])};
 const summarize=A=>{const out={};for(let k=1;k<=7;k++){const B=A.filter(a=>a.k===k);if(!B.length)continue;const st=new Set();B.forEach(a=>a.stu.forEach(s=>st.add(nz(s))));
  const extra=B.filter(a=>!a.stu.length&&!a.whole).reduce((s,a)=>s+a.cnt,0);const o={n:B.length,stu:st.size+extra,whole:B.filter(a=>a.whole).length};
  if(k===3){o.ind=B.filter(a=>/فردي/.test(a.det)&&!a.whole).length;o.grp=B.length-o.ind;o.top=topOf(B,a=>seg(a.det,1),4)}
  else if(k===1){o.pa=B.filter(a=>a.pa).length;o.top=topOf(B.filter(a=>!a.pa),a=>seg(a.det,0),3)}
  else if(k===5)o.top=topOf(B,a=>seg(a.det,0)==='من الميزان'?'عبر الميزان ('+seg(a.det,1)+')':seg(a.det,0),4);
  else if(k===4)o.top=topOf(B,a=>seg(a.det,0),3);
  else if(k===6)o.top=topOf(B,a=>seg(a.det,0).replace(/\s*\(شهادة من سبع سنابل\)/,''),4);
  else if(k===7)o.top=topOf(B,a=>(seg(a.det,0)+(seg(a.det,1)?': '+seg(a.det,1):'')).trim(),4);
  out[k]=o}return out};
 const by=new Map();DORDER.forEach(d=>by.set(d,[]));staff.forEach(s=>{if(!by.has(s.dept))by.set(s.dept,[]);by.get(s.dept).push(s)});

 if(s[7]){const x=s[7];L.push('<b>الأنشطة وتعلّم الأقران:</b> '+N(x.n)+' نشاط'+top(x.top))}
 return L}
function stuCol(p){if(p<50){const t=Math.max(0,Math.min(1,(50-p)/30));return 'hsl(352,'+(70+t*10)+'%,'+(91-t*6)+'%)'}const t=(p-50)/20;return 'hsl('+(22+t*26)+',90%,'+(87+t*3)+'%)'}
function stuBox(Q){return '<div class="stb"><div class="stt">تحديد الفئات · طالباتها دون 70% في اختبار منتصف الفصل الأول ('+Q.stl.length+') <span style="font-weight:500;color:var(--muted)">· ✓ وصلتها إجراءات المعلمة</span></div><div class="stw">'+Q.stl.map(r=>'<span class="stc'+(r[5]?'':' no')+'" style="background:'+stuCol(r[2])+'"><b>'+esc(r[0])+'</b><small>'+esc(r[1])+'</small><em>'+(r[3]!=null&&r[4]?r[3]+' من '+r[4]+' · ':'')+r[2]+'%</em>'+(r[5]?'<i>✓</i>':'')+'</span>').join('')+'</div></div>'}
function cards(dep,q){const ts=T(dep,q);
 return '<h4>ما نفّذته كل معلمة</h4><div class="cards">'+ts.map(t=>{const Q=t.Q;const L=bullets(Q,q);
  const ks=Q.req;
  return '<div class="card"><div class="hd"><b>أ. '+esc(t.n)+'</b>'+(t.role==='منسقة'?'<span class="rl">منسقة القسم</span>':'')+'<span class="sp"></span><span class="ears">'+(q==='1'?ks:[2].concat(ks)).map(k=>earImg(!!Q.sm[k]||k===2,EARS[k][0])).join('')+'</span>'+lvB(Q.ratio)+'</div>'+(Q.enr.length?'<div class="enr">✦ تميّز إضافي: '+Q.enr.map(k=>EARS[k][0]).join('، ')+'</div>':'')+
  (L.length?'<ul>'+L.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<div class="none">لم يُوثَّق في سبع سنابل إجراء لهذه الفترة.</div>')+
  (q!=='1'&&Q.stl&&Q.stl.length?stuBox(Q):'')+(q==='2'&&Q.tg?'<div class="cov">الوصول إلى المستهدفات<span class="tr"><i style="width:'+(Q.reach/Q.tg*100)+'%;background:'+(Q.reach/Q.tg>=.8?'#3F9152':Q.reach/Q.tg>=.5?'#C9A227':'#C9586C')+'"></i></span>'+Q.reach+' من '+Q.tg+'</div>':'')+
  (!PR&&Q.list.length?'<details class="log"><summary>سجل الإجراءات ('+Q.list.length+')</summary><table><thead><tr><th>التاريخ</th><th>الشعبة</th><th>السنبلة</th><th>التفاصيل</th></tr></thead><tbody>'+Q.list.map(r=>'<tr><td>'+dfmt(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+EARS[r[2]][1]+'</td><td>'+esc(r[3])+(r[4]>0?' <small style="color:var(--muted)">('+r[4]+' طالبة)</small>':r[4]<0?' <small style="color:var(--muted)">(الشعبة كاملة)</small>':'')+'</td></tr>').join('')+'</tbody></table></details>':'')+'</div>'}).join('')+'</div>'}
function comment(dep,q){const V=DATA.depts.indexOf(dep)+(q==='2'?1:0);const A=agg(dep,q);const ts=T(dep,q);const n=ts.length;
 if(!A.total)return '<div class="cm"><div class="t">قراءة النائبة الأكاديمية</div><p>لم تُوثَّق في سبع سنابل إجراءات لهذا القسم خلال هذه الفترة، وأوصي بتوثيق ما نُفّذ فعليًا داخل المنصة؛ لأن سبع سنابل هي المرجع المعتمد لقياس إجراءات رفع التحصيل وأثرها.</p></div>';
 const best=ts.slice().sort((a,b)=>b.Q.got-a.Q.got||b.Q.enr.length-a.Q.enr.length||b.Q.total-a.Q.total)[0];
 const full=ts.filter(t=>t.Q.ratio>=.8).map(t=>'أ. '+t.n);
 const per=Math.round(A.total/n*10)/10;
 const P1=[];
 P1.push('أتقدم بخالص الشكر والتقدير لمعلمات قسم '+esc(dep.dept)+' على ما وثّقنه في سبع سنابل خلال '+(q==='1'?'الربع الأول':'الربع الثاني')+': '+N(A.total)+' إجراءً بمعدل '+per+' إجراء لكل معلمة، شاركت فيها '+A.act+' من أصل '+n+' معلمات'+(A.e[3]?'، منها '+N(A.e[3])+' حصة إثرائية استفادت منها '+N(A.stu3)+' طالبة':'')+'.');
 if(best&&best.Q.total)P1.push('وتميّزت أ. '+esc(best.n)+' باستكمال '+best.Q.got+' من '+best.Q.req.length+' سنابل أساسية'+(best.Q.enr.length?' مع '+best.Q.enr.length+' سنابل إثرائية':'')+' ('+N(best.Q.total)+' إجراءً)، وهذا يدل على '+(q==='1'?['وعيٍ وقائي مبكر وحرصٍ على تهيئة الطالبات قبل الاختبار.','تخطيطٍ استباقي يسبق الاختبار ولا ينتظر نتائجه.','حسٍّ تربوي يقرأ احتياج الطالبات قبل أن يظهر في الدرجات.','مبادرةٍ ذاتية وإيمانٍ بأن الوقاية أيسر من العلاج.'][V%4]:['متابعةٍ علاجية متكاملة بُنيت على نتائج الاختبار.','قراءةٍ دقيقة للنتائج تحوّلت إلى إجراءات ملموسة مع الطالبات.','التزامٍ بخطة الدعم وحرصٍ على ألّا تتأخر طالبة عن زميلاتها.','قدرةٍ على الربط بين تشخيص الضعف وعلاجه وإشراك ولي الأمر فيه.'][V%4])+(full.length>1?' كما بلغت '+full.length+' معلمات مستوى «سنبلة ذهبية» فأعلى.':''));
 if(q==='2'&&A.tg)P1.push('وبلغت تغطية الطالبات المستهدفات (أقل من 70% في اختبار منتصف الفصل) '+A.reach+' من '+A.tg+' ('+Math.round(A.reach/A.tg*100)+'%).');
 const R=[];const ks=q==='1'?[3,5]:[1,3,5];const ez=ts.filter(t=>t.Q.enr.length).length;if(ez)P1.push('وأضافت '+ez+' '+(ez>2&&ez<11?'معلمات':'معلمة')+' إلى السنابل الأساسية إجراءات إثرائية من تغذية راجعة وتعزيز وأنشطة، وهي تميّز يُحسب لهن.');
 const miss=ks.filter(k=>dep.core||k!==3).map(k=>[k,ts.filter(t=>t.Q.req.includes(k)&&!t.Q.sm[k]).length]).filter(x=>x[1]>=Math.max(2,Math.ceil(n/2))).sort((a,b)=>b[1]-a[1]).slice(0,2);
 const BASIS={1:['لأن تحليل النتائج يحدد المهارات المفقودة لكل طالبة، وتُبنى عليه الخطة العلاجية','لأن الخطة العلاجية لا تُبنى دون تشخيص دقيق لمواطن الضعف في الورقة الاختبارية'],3:['لأن الحصص الإثرائية مطلوبة من معلمات المواد الأساسية وفق معايير سبع سنابل','لأن الحصة الإثرائية هي الأداة الأقرب لتعويض الفاقد وإعادة الشرح للطالبة'],4:['لأن التغذية الراجعة المكتوبة تُعرّف الطالبة بأخطائها مباشرة قبل الاختبار التالي','لأن مناقشة الورقة الاختبارية مع الطالبة تمنع تكرار الخطأ نفسه'],5:['لأن الشراكة مع ولي الأمر تُقاس بنسبة أولياء أمور طالبات المعلمة الذين تم التواصل معهم','لأن إطلاع ولي الأمر على مستوى ابنته يضاعف أثر خطة الدعم في البيت'],6:['لأن التعزيز والتحفيز سنبلة أساسية لا تُغني عنها الحصص الإثرائية وفق معايير سبع سنابل','لأن الإشادة بالتقدّم تحفظ دافعية الطالبة وتثبّت ما تحقق'],7:['لأن الأنشطة الصفية وتعلّم الأقران تثبّت المفاهيم وتنوّع أساليب الدعم','لأن تعلّم الأقران يتيح للمتمكنة أن تدعم زميلتها ويثبّت التعلم لدى الاثنتين']};
 miss.forEach(([k,c])=>R.push('توثيق إجراءات «'+EARS[k][0]+'» لدى '+c+' معلمات لم يُوثّقنها بعد؛ '+BASIS[k][V%2]+'.'));
 const z=ts.filter(t=>!t.Q.total).length;if(z)R.push('متابعة منسقة القسم لـ'+z+' '+(z>2?'معلمات':'معلمة')+' دون إجراءات موثقة في هذه الفترة؛ للتحقق من التوثيق في المنصة، لأن ما لا يُوثّق لا يُحتسب للمعلمة.');
 if(q==='2'&&A.tg&&A.reach<A.tg)R.push('الوصول إلى الطالبات المستهدفات المتبقيات ('+(A.tg-A.reach)+' طالبة) قبل اختبارات نهاية الفصل الأول؛ لأن الوصول إلى كل طالبة أقل من 70% شرط إلزامي في سياسة الدعم.');
 return '<div class="cm"><div class="t">قراءة النائبة الأكاديمية</div>'+P1.map(x=>'<p>'+x+'</p>').join('')+(R.length?'<p style="margin-top:6px"><b>وأوصي بـ:</b></p><ol>'+R.map(x=>'<li>'+x+'</li>').join('')+'</ol>':'')+'</div>'}
function quarter(dep,q,i,last){const M=Object.assign({},QT[q]);if(q==='2')M.r='من 12 أكتوبر 2026 حتى '+dlong(DATA.meta.today);return '<section class="q"><div class="qban"><div class="num">الربع<br>'+(q==='1'?'الأول':'الثاني')+'</div><div><h3>'+M.h+'</h3><p>'+M.r+' · '+M.p+'</p></div></div>'+(agg(dep,q).total?kpis(dep,q)+matrix(dep,q)+bars(dep,q)+cards(dep,q):'<div class="intro" style="display:block">معلمات القسم: '+T(dep,q).map(t=>'أ. '+esc(t.n)).join('، ')+'.</div>')+'<div class="endb">'+comment(dep,q)+(last?SIGB():'')+'</div></section>'}
function overview(){const Q=DATA.meta.quarters;const rows=DATA.depts.map((d,i)=>({d,i,a:Q.map(q=>agg(d,q))}));const mx=Q.map((q,j)=>Math.max(...rows.map(r=>r.a[j].total/r.d.n)));const lq=Q[Q.length-1];
 return '<div class="intro">نظرة عامة على الأقسام: متوسط الإجراءات لكل معلمة (المجموع ÷ عدد معلمات القسم)، حتى لا يظهر القسم الصغير أضعف لقلة عدد معلماته. اضغطي على أي قسم لعرض تفاصيله.</div><section class="q"><div class="tw"><table class="ov"><thead><tr><th style="text-align:right">القسم</th><th>المعلمات</th>'+Q.map(q=>'<th>'+QL[q][0]+'<br>إجراءات</th><th>لكل معلمة</th>').join('')+'<th>تغطية المستهدفات<br>('+QL[lq][0]+')</th></tr></thead><tbody>'+
 rows.map(r=>{const L=r.a[r.a.length-1];return '<tr style="cursor:pointer" data-go="'+r.i+'"><td class="n">'+esc(r.d.dept)+'</td><td>'+r.d.n+'</td>'+r.a.map((a,j)=>{const p=a.total/r.d.n;return '<td>'+N(a.total)+'</td><td class="'+cellCls(p,mx[j])+'"><b>'+(Math.round(p*10)/10)+'</b></td>'}).join('')+'<td>'+(L.tg?Math.round(L.reach/L.tg*100)+'% <small style="color:var(--muted)">('+L.reach+' من '+L.tg+')</small>':'—')+'</td></tr>'}).join('')+'</tbody></table></div></section>'}
function render(){const app=document.getElementById('app');
 if(!PR){document.getElementById('dp').innerHTML='<button data-d="-1" aria-pressed="'+(st.d===-1)+'">نظرة عامة</button>'+DATA.depts.map((d,i)=>'<button data-d="'+i+'" aria-pressed="'+(st.d===i)+'">'+esc(d.dept)+'</button>').join('');
  document.getElementById('qt').style.display=st.d===-1?'none':'';
  document.getElementById('qt').innerHTML=DATA.meta.quarters.map(k=>'<button data-q="'+k+'" aria-pressed="'+(st.q===k)+'">'+QL[k][0]+(QL[k][1]?' ('+QL[k][1]+')':'')+'</button>').join('')}
 if(st.d===-1){app.innerHTML=overview();return}
 const dep=DATA.depts[st.d];
 const QH={1:'الخطة الوقائية ما قبل اختبارات منتصف الفصل الدراسي الأول',2:'الخطة العلاجية والتعزيزية ما بعد اختبارات منتصف الفصل الدراسي الأول'};
 const head=(PR?'<div class="ttl"><h1>إجراءات رفع التحصيل الأكاديمي · قسم '+esc(dep.dept)+'</h1><div class="s">'+QL[st.q][0]+' · '+(QH[st.q]||'')+' · 2026–2027</div><div class="v">﴿ وَاللَّهُ يُضَاعِفُ لِمَن يَشَاءُ ﴾ <small>[البقرة: 261]</small></div></div><div class="lnk"><a href="'+LINK+'#d='+st.d+'&q='+st.q+'">افتح النسخة التفاعلية</a><span class="pw">🔒 لفتح اللوحة التفاعلية يرجى إدخال الرقم السري: <b>2030</b></span></div>':'')+ '<div class="dhead"><h2>قسم '+esc(dep.dept)+'</h2><span class="pill">عدد معلمات القسم: '+dep.n+'</span><span class="sp"></span>'+(PR?'<span class="meta">مصدر البيانات: إجراءات المعلمات الموثقة في سبع سنابل حتى '+dlong(DATA.meta.today)+'</span>':(LH?'<button class="pdfb" data-pdf="1">تصدير PDF محدّث · '+QL[st.q][0]+'</button>':''))+'</div>';
 const qs=[st.q];
 app.innerHTML=head+qs.map((q,j)=>quarter(dep,q,st.d,PR&&j===qs.length-1)).join('')}
function SIGB(){return '<div class="sig"><div class="b"><div class="t">النائبة الأكاديمية</div><div class="nm"><b>أ. آسيا الذبياني</b><img src="'+SIG+'" alt=""></div><div class="pr2">مديرة المدرسة · أ. شيخة الرميحي</div></div></div>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-d],[data-q],[data-go]');if(!b)return;if(b.dataset.d!=null)st.d=+b.dataset.d;if(b.dataset.go!=null){st.d=+b.dataset.go;scrollTo(0,0)}if(b.dataset.q)st.q=b.dataset.q;try{history.replaceState(null,'','#d='+st.d+'&q='+st.q)}catch(_){}if(EMB)try{parent.postMessage({type:'ijr-st',d:st.d,q:st.q},location.origin)}catch(_){}render()});
function setSv(){document.getElementById('sv').textContent='آخر تحديث للبيانات: '+new Date(DATA.meta.saved).toLocaleString('ar-QA-u-nu-latn',{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'})}
function postH(){if(EMB)try{parent.postMessage({type:'ijr-h',h:document.documentElement.scrollHeight},location.origin)}catch(_){}}
if(EMB&&window.ResizeObserver)new ResizeObserver(postH).observe(document.body);
function doPdf(){if(!LH){alert('تعذّر تحميل الترويسة، حدّثي الصفحة وحاولي مرة أخرى');return}
 const keep=document.title;PR=true;document.body.classList.add('pr');render();
 const app=document.querySelector('.wrap');const lay=document.createElement('table');lay.className='lay';lay.innerHTML='<thead><tr><td class="lh1"></td></tr></thead><tfoot><tr><td class="lh2"></td></tr></tfoot><tbody><tr><td id="cell"></td></tr></tbody>';
 app.parentNode.insertBefore(lay,app);document.getElementById('cell').appendChild(app);
 const bg=document.createElement('div');bg.className='bgl';bg.innerHTML='<img src="'+LH+'">';document.body.prepend(bg);
 const css=document.createElement('style');css.id='prcss';css.textContent=PRCSS;document.head.appendChild(css);
 document.title='إجراءات رفع التحصيل - قسم '+DATA.depts[st.d].dept+' - '+QL[st.q][0];
 const undo=()=>{lay.parentNode.insertBefore(app,lay);lay.remove();bg.remove();css.remove();document.body.classList.remove('pr');PR=false;document.title=keep;render();postH()};
 const img=bg.querySelector('img');const go=()=>setTimeout(()=>{window.print();setTimeout(undo,400)},350);if(img.complete)go();else img.onload=go}
const PRCSS=`@page{size:A4;margin:0}html,body{background:transparent!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .bgl{position:fixed;inset:0;z-index:-1}.bgl img{width:100%;height:100%}
 table.lay{width:100%;border-collapse:collapse;table-layout:fixed;font-size:inherit}table.lay>*>tr>td{padding:0 12mm;border:0;background:none!important;text-align:right;vertical-align:top;white-space:normal}.lh1{height:31mm}.lh2{height:20mm}`;
document.addEventListener('click',e=>{if(e.target.closest('[data-pdf]'))doPdf()},true);
function boot(R){DATA=buildData(R);if(!DATA.meta.quarters.includes(st.q))st.q='1';if(st.d>=DATA.depts.length)st.d=0;setSv();render();postH()}
if(RAW0)boot(RAW0);
else if(EMB){addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='ijr')return;if(e.data.sig)SIG=e.data.sig;if(e.data.lh)LH=e.data.lh;boot(e.data)});parent.postMessage({type:'ijr-ready'},location.origin)}
})();
</script></body></html>
